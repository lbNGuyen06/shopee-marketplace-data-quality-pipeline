[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-marketplace-data-quality"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "pyodbc>=5,<6",
]

[project.scripts]
shopee-quality = "shopee_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"
