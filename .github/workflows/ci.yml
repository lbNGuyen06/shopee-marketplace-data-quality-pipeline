name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  unit:
    name: Unit and configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unixodbc-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --requirement requirements-dev.txt

      - name: Check whitespace
        run: git diff --check

      - name: Run unit tests
        run: python -m pytest

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: shopee_ci
          POSTGRES_USER: shopee_ci
          POSTGRES_PASSWORD: synthetic-ci-password
        run: |
          cp .env.example .env
          docker compose --profile airflow config --quiet
          rm .env

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: shopee_ci
      POSTGRES_USER: shopee_ci
      POSTGRES_PASSWORD: synthetic-ci-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unixodbc-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --requirement requirements-dev.txt

      - name: Start isolated PostgreSQL
        run: |
          cp .env.example .env
          docker compose up --detach --wait postgres

      - name: Run SQL smoke test
        run: |
          docker compose exec -T postgres sh -c 'psql \
            -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f /workspace/sql/tests/postgres_smoke_test.sql'

      - name: Run PostgreSQL integration test
        run: |
          python -m pytest \
            tests/integration/test_postgres_ingestion.py \
            --verbose \
            --tb=short

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker compose down --volumes
